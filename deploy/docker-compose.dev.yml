# Local development only: a PostgreSQL database for the API.
# Start:  docker compose -f deploy/docker-compose.dev.yml up -d
# Stop:   docker compose -f deploy/docker-compose.dev.yml down
# The values below are local-only defaults, not real secrets.
name: sellease-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sellease
      POSTGRES_USER: sellease
      POSTGRES_PASSWORD: sellease_local_dev
      TZ: Asia/Karachi
    ports:
      - "5433:5432"
    volumes:
      - sellease_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellease -d sellease"]
      interval: 5s
      retries: 10

volumes:
  sellease_db:
